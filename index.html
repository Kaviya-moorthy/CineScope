<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CineScope helps you discover movies and find where to watch them legally." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CineScope: discover movies and where to watch them</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('cinescope:theme'));
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
